name = "machcsl"
defaultTargets = ["MachCSL", "Xv6"]

# Transfinite Iris-Lean: the `Iris/` subdirectory of the fork dongjaelee1/iris-lean, branch
# `transfinite`, whose committed step-index choice is the ordinal one (`Iris.SI := Ordinal.{3}`).
[[require]]
name = "iris"
git = "https://github.com/dongjaelee1/iris-lean"
rev = "439abbbb32bd4986c5b47174c9ce51adb1f6f01f"
subDir = "Iris"

# lean-sail (the Sail Lean runtime): upstream, by git, at tag v7 -- its `Sail.ArchSem.PreSailM` is
# the free monad over `InstructionEffect` that MachCSL steps.  The generated model's own
# lakefile.toml requires the SAME revision (tools/regen_sail_model.sh writes it;
# tools/ci/toolchain_check.sh checks that the two agree).
[[require]]
name = "Sail"
git = "https://github.com/rems-project/lean-sail"
rev = "01bb54c7c8a69e52ba11863c67e7c403a6cd198a"

# The Sail RISC-V model compiled to Lean (generated; see tools/regen_sail_model.sh).
[[require]]
name = "Lean_RV64D"
path = "model/Lean_RV64D"

# `maxRecDepth = 100000` tree-wide (Lean >= 4.34): the default 512 is too small for `simp` on the
# `k_step` goals of the kernel proofs and for the kernel's own bound (which now follows this
# option) on the long proof-mode proofs; the heavy theorems used to set it one by one.
# `linter.unusedVariables` / `linter.unusedSectionVars` are off tree-wide:
# a Spec statement names its preconditions for the reader (and after Rocq)
# though the declaration itself never mentions them, and the section
# variables of the instance-heavy sections are included by design.  (They
# used to be switched off file by file.)  The other linters stay on, so a
# warning in the build log is worth reading.
[[lean_lib]]
name = "MachCSL"
leanOptions = { maxRecDepth = 100000, autoImplicit = false, relaxedAutoImplicit = false, linter.unusedVariables = false, linter.unusedSectionVars = false }

# The xv6 kernel proofs, kept separate from the MachCSL framework.
[[lean_lib]]
name = "Xv6"
leanOptions = { maxRecDepth = 100000, autoImplicit = false, relaxedAutoImplicit = false, linter.unusedVariables = false, linter.unusedSectionVars = false }

# The device-conformance suite (vtest-lean/): the machine model re-checked
# against behaviours captured from QEMU.  NOT a default target: a red test is
# a finding about the model and must not break the proof build
# (`make vtest-check`; see tools/vtest/README.md).
[[lean_lib]]
name = "Vtest"
srcDir = "vtest-lean"
leanOptions = { maxRecDepth = 100000, autoImplicit = false, relaxedAutoImplicit = false, linter.unusedVariables = false, linter.unusedSectionVars = false }
