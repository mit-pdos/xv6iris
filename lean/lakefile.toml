name = "xv6iris"
defaultTargets = ["Xv6Iris"]

# iris-lean lives in the `Iris/` subdirectory of the upstream monorepo.
# Pinned to a known-good rev on toolchain v4.31.0 (see lean-toolchain).
[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean"
rev = "3877dbeccd1b0545c5be7ef73318e8c86acf79ab"
subDir = "Iris"

# The free-monad fork of lean-sail (vendored, small) and the upstream generated
# RISC-V model (pulled in by `tools/fetch-model.sh` into `.model/`, not vendored).
# Run `make model` (or `tools/fetch-model.sh`) once before building.
[[require]]
name = "Sail"
path = "vendor/lean-sail"

[[require]]
name = "Lean_RV64D"
path = ".model/sail-riscv-lean"

[[lean_lib]]
name = "Xv6Iris"
