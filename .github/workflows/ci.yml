name: CI

# Builds the Sail-generated Rocq model (model-xv6iris/), the checked-in kernel
# dump (kernel-rocq/), the checked-in user-program dumps (user-rocq/), the
# Iris proofs (iris/), and the device-conformance tests (vtest-rocq/) against
# the QEMU captures checked in beside them.
#
# It deliberately does NOT:
#   * build the xv6 kernel ELF (the `xv6-riscv/` tree is .gitignored / absent),
#   * regenerate kernel-rocq/KernelInstrs.v (or the sibling KernelData/KernelSyms),
#   * regenerate the Sail model .v files (needs the `sail` compiler),
#   * run QEMU to look for new hardware behaviours (that is `make vtest-gen`,
#     which needs qemu-system-riscv64 and the riscv64 toolchain and is run by
#     hand; the captures it produces are checked in, and CI only re-checks the
#     model against them).
# The .v files for all four are checked in; CI only (re)compiles them to .vo.
# After the build, it best-effort clones (but never builds) `xv6-riscv/` so the
# proof-coverage report can attribute functions to source files; see the note
# on that step below.

on:
  push:
    branches: [main]
  pull_request:

# A new push does NOT cancel the in-flight run: it finishes, and the new push
# waits as pending.  GitHub keeps at most one pending run per group, so a burst
# of pushes coalesces -- each new push supersedes the previously-pending one --
# and the latest commit is built as soon as the running build completes.  (With
# cancel-in-progress, a push faster than the build time would starve CI: every
# run cancelled before finishing, so nothing ever completes.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: coqdev

    # WITHOUT THIS, a `run:` step gets GitHub's *default* shell, `bash -e {0}` --
    # which does NOT set pipefail.  Every `make … | tee log` below would then
    # exit with tee's status, i.e. always 0, and a failed proof build would sail
    # through as green.  Naming `bash` explicitly selects
    # `bash --noprofile --norc -eo pipefail {0}` instead, so the left-hand side
    # of a pipe fails the step.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # Creates a project-local opam switch in $GITHUB_WORKSPACE/_opam and loads
      # its environment, so plain `opam exec -- …` targets that switch.
      # (setup-ocaml's own cache only covers the bare compiler switch, since it
      # runs before the `opam install` below — hence the explicit cache step.)
      - name: Set up OCaml / opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-repositories: |
            coq-released: https://coq.inria.fr/opam/released
            default: https://opam.ocaml.org

      # Cache the whole built switch (Rocq + Iris + Sail support take many
      # minutes to compile).  Keyed on the OS, compiler, and the pinned package
      # list — editing .github/coq-deps.txt busts the cache; the restore-keys
      # let an older switch be reused and reconciled by `opam install` on a miss.
      #
      # The key is also scoped to runner.name: a project-local opam switch bakes
      # its absolute workspace path into the switch, so it is NOT relocatable.
      # Different runners have different workspace paths (e.g. hosted
      # /home/runner/work/... vs. self-hosted /home/ubuntu/actions-runner/_work/...),
      # so a switch cached on one runner is invalid on another — restoring it
      # clobbers setup-ocaml's fresh switch and yields "No switch is currently
      # set".  Scoping by runner.name keeps each runner's cache to itself.
      - name: Cache opam switch
        uses: actions/cache@v5
        with:
          path: _opam
          key: ${{ runner.os }}-${{ runner.name }}-opam-5.3-${{ hashFiles('.github/coq-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.name }}-opam-5.3-

      # Pinned to match the development switch (Rocq 9.0.1, Iris 4.4.0, Sail
      # support 0.20.1).  The leaf packages pull in coq-stdpp transitively, but
      # we pin them too for a reproducible solve.  No-op on a cache hit.
      - name: Install Rocq / Iris / Sail toolchain
        run: opam install -y $(cat .github/coq-deps.txt)

      # ---- 1 + 2. Sail model (model-xv6iris/) and kernel dump (kernel-rocq/) ----
      # These two trees don't depend on one another, so build them concurrently.
      #
      #   * `make model` only depends on the model's _CoqProject — no ELF, no Sail.
      #   * For kernel-rocq we generate the CoqMakefile from the checked-in
      #     _CoqProject and run it directly, skipping the top-level `kernel-rocq`
      #     target whose .v rules depend on the (absent) kernel ELF and would
      #     otherwise clone+build xv6 and regenerate KernelInstrs.v.
      #
      # The same reasoning covers user-rocq/ (the dumped USER program images,
      # e.g. _sync): its top-level `user-rocq` target likewise depends on the
      # absent user ELFs, so CI generates its CoqMakefile and compiles the
      # checked-in .v directly.  The iris build needs its .vo (iris/_CoqProject
      # maps `-R ../user-rocq User`; UCodeSync.v Requires User.SyncInstrs).
      #
      # The kernel-rocq / user-rocq CoqMakefiles are generated first (cheap);
      # the model's is produced by `make model` itself.  All three sub-builds
      # are then backgrounded and waited on; the step fails if any one fails.
      - name: Build Sail model + kernel/user dumps (in parallel, no ELF rebuild / no regen)
        run: |
          make SWITCH="$GITHUB_WORKSPACE" kernel-rocq/CoqMakefile
          make SWITCH="$GITHUB_WORKSPACE" user-rocq/CoqMakefile

          make SWITCH="$GITHUB_WORKSPACE" model &
          pid_model=$!
          opam exec -- make -C kernel-rocq -f CoqMakefile -j"$(nproc)" &
          pid_kernel=$!
          opam exec -- make -C user-rocq -f CoqMakefile -j"$(nproc)" &
          pid_user=$!

          rc=0
          wait $pid_model || rc=1
          wait $pid_kernel || rc=1
          wait $pid_user || rc=1
          exit $rc

      # ---- 3. Iris proofs (iris/) ----
      # Built directly (not via `make proofs`) for the same reason: `proofs`
      # depends on the `kernel-rocq` target which pulls in the kernel ELF.  The
      # model, kernel-rocq and user-rocq .vo from the previous steps are on
      # disk already.
      - name: Build Iris proofs (iris/)
        run: |
          make SWITCH="$GITHUB_WORKSPACE" iris/CoqMakefile
          # Profiled build: TIMED=1 prints a per-file `Foo.vo (real: T, ...)`
          # line; TIMING=1 writes a per-sentence `<file>.v.timing` next to each
          # .v.  Both add negligible overhead but let the next step report where
          # the wall-clock goes.  `tee` keeps the per-file log for the profiler;
          # the job sets `shell: bash` (-eo pipefail), so a make failure still
          # fails here rather than being masked by tee's exit status.
          #
          # `--output-sync=target` is what keeps that log PARSEABLE.  Each TIMED
          # record is written by its own `command time`, all to this one pipe, so
          # without it two records interleave mid-line under -j (seen in run
          # 30438637495: "SpecConsoleintr.vo (reaSlp:e cSysPipe.vo (real: ...,
          # sys: 4.040.55,,") and the profiler loses both.  -O makes make buffer
          # each target's output and emit it whole.  It changes nothing the
          # profiler measures: per-file wall comes from the record itself and the
          # parallelism chart from .vo mtimes, neither from log line order.
          opam exec -- make -C iris -f CoqMakefile -j"$(nproc)" \
            --output-sync=target TIMED=1 TIMING=1 \
            2>&1 | tee "$RUNNER_TEMP/iris-build.log"

          # Grep the log as well as trusting the exit status, per
          # claude-notes/durable-notes.md.  The exit status IS propagated here
          # (verified: `command time` forwards a nonzero child status, and
          # pipefail makes tee not mask it), so this is belt-and-braces against
          # a future edit reintroducing the masking that b906a5b fixed.
          # Bare "Error" (as in dead-imports.yml) catches BOTH Rocq's "Error:"
          # and make's "*** [CoqMakefile:801: Foo.vo] Error 1"; verified
          # false-positive-free against run 30438637495's green build output
          # (0 matches in 1927 lines, and no iris file has "Error" in its name).
          if grep -q "Error" "$RUNNER_TEMP/iris-build.log"; then
            echo "::error::Errors in the iris build log despite a zero exit status."
            grep -B5 "Error" "$RUNNER_TEMP/iris-build.log" | head -50
            exit 1
          fi

      # ---- 3b. Assumption audits (iris/SystemAssumptions.v, UnionAssumptions.v) ----
      # `Print Assumptions`, the only check that sees through every functor and
      # seal.  TWO THEOREMS, because NEITHER CONE CONTAINS THE OTHER:
      # xv6_fs_adequacy_xv6Σ is the chain at the TRIVIAL application and names
      # no user program, so it never walks the Uk*/USh*/UInit*/UEcho* tier;
      # union_adequacy_closed is the same chain at AppUnionRec.app_union (the
      # file lines and the pipelines, across power cycles), closed, and its
      # cone does.  Nor can a grep for `Admitted`/`Axiom` stand in for the
      # second: a Spec*.v module Parameter that no Link*.v discharged sits in
      # the proof term unmentioned by any source line.
      #
      # Each is a file of its own, out of iris/_CoqProject on purpose (the
      # commented rows there are what tell proof_coverage.py so), compiled here
      # against the tree the previous step built.  The system one used to be a
      # line inside SystemAdequacy.v, 95 s of that file's 98.6 s on the serial
      # build tail; CI pays that, a developer's `make proofs` no longer does.
      #
      # THEY RUN CONCURRENTLY.  Naming both targets on one `make` line would
      # serialise them -- make walks command-line goals in order unless it is
      # itself parallel -- and they are single-threaded coqc processes sharing
      # nothing but the .vo they read, so the overlap roughly halves the step.
      # `make audit-all-only` is the same pairing for a developer; CI
      # backgrounds the targets itself only because it needs each audit's
      # output in a log of its own for the summary.
      #
      # `audit-only`/`audit-union-only`, not `audit`/`audit-union`: the latter
      # depend on `proofs`, whose kernel-rocq prerequisite pulls in the absent
      # kernel ELF (see the note atop this file).  `-s` keeps make's recipe echo
      # out of the captured stdout; coqc's warnings go to stderr and stay in the
      # job log rather than the summary.
      #
      # The lists are REPORTED, not diffed against an expected set -- same
      # contract as when they lived in the build log, so read them.  The step
      # fails if either coqc does, and both sections are written either way,
      # which is why the two exit statuses are collected separately.
      - name: Assumption audits (iris/, Print Assumptions, system + application in parallel)
        run: |
          rc_sys=0
          rc_app=0
          make -s SWITCH="$GITHUB_WORKSPACE" audit-only \
            > "$RUNNER_TEMP/assumptions-system.log" &
          pid_sys=$!
          make -s SWITCH="$GITHUB_WORKSPACE" audit-union-only \
            > "$RUNNER_TEMP/assumptions-app.log" &
          pid_app=$!
          wait $pid_sys || rc_sys=$?
          wait $pid_app || rc_app=$?

          {
            echo "## Assumption audit"
            echo
            echo "### \`SystemAdequacy.xv6_fs_adequacy_xv6Σ\`"
            echo
            if [ "$rc_sys" -ne 0 ]; then
              echo "> :x: exit $rc_sys — output below is partial."
              echo
            fi
            echo '```'
            cat "$RUNNER_TEMP/assumptions-system.log"
            echo '```'
            echo
            echo "### \`UInitUnion.union_adequacy_closed\`"
            echo
            if [ "$rc_app" -ne 0 ]; then
              echo "> :x: exit $rc_app — output below is partial."
              echo
            fi
            echo '```'
            cat "$RUNNER_TEMP/assumptions-app.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc_sys" -ne 0 ] || [ "$rc_app" -ne 0 ]; then
            echo "::error::An assumption audit failed (system: $rc_sys," \
                 "application: $rc_app); see the step summary."
            exit 1
          fi

      # ---- 3b'. Trusted base of the adequacy statement (iris/) ----
      # The other half of the audit above.  `Print Assumptions` answers "what
      # does the PROOF assume"; this answers "what must a human READ for the
      # statement to say what they think it says".  Rocq's kernel checks the
      # proof, so nothing a proof mentions needs trusting -- but every
      # definition the STATEMENT unfolds to does, and that set is what the
      # report lists, per file and per line.
      #
      # The whole trick is the seed: tcb-report.sh points
      # `Print All Dependencies` at a DEFINITION WHOSE BODY IS THE STATEMENT,
      # not at the theorem (which would walk the proof cone -- the untrusted
      # half).  ~3 s against the tree the previous steps built; it needs both
      # the .vo (to Require FsAdequacyImg) and the .glob (to map definitions
      # to source lines), which is why it runs after the iris build and before
      # the profile step deletes its scratch.
      #
      # `--only iris` because that is the part a reader of this project
      # reviews; the report footnotes the model-xv6iris/ and kernel-rocq/
      # counts, which are the generated Sail model and the mkfs image bytes
      # and are not "read" in the same sense.
      #
      # REPORT, NOT A CHECK: no baseline is diffed, same contract as the
      # assumption audit.  What to watch is the FILE COUNT -- a jump means a
      # statement-level definition picked up a dependency on a new part of the
      # tree, which is the one way this number moves for a bad reason.  The
      # step fails only if coqc does, and writes the summary either way.
      - name: Adequacy trusted base (iris/, definitions the STATEMENT depends on)
        # Both the shell driver and the Python reporter read $SWITCH; CI's is
        # the project-local switch setup-ocaml built in the workspace, not the
        # dev machine's /shared/xv6rocq that the scripts default to.
        env:
          SWITCH: ${{ github.workspace }}
        run: |
          # ALL THREE RUNGS OF THE LADDER, most general first, AND THEN THE
          # APPLICATION:
          #   riscv_power_adequacy       -- the machine, an ABSTRACT crash
          #     invariant [Pc], any [phi].  The "any provable pure trace
          #     property" theorem; it names no file system at all.
          #   xv6_power_adequacy_xv6Sigma -- xv6's instance: [Pc] fixed at
          #     [FsCrash.P_fs_named], [phi] still free.  The dearest of the
          #     four to state: it names BOTH the Iris ghost layer (via the
          #     [Hphi] hypothesis, an iProp entailment) and the FS durability
          #     record.
          #   xv6_fs_adequacy_xv6Sigma   -- [phi] chosen.
          #   union_adequacy_closed -- the chain at the UNION application
          #     (UInitUnion; echo, echo > f, cat f, echo | cat^n, cat f | cat^n),
          #     closed.  It replaced the file and pipeline applications'
          #     theorems (union cut C9h deleted them).
          #
          # NEITHER OF THE MIDDLE TWO CONTAINS THE OTHER: a free [phi] puts
          # the ghost layer in that base, while only the fs one reaches the
          # pure FS-consistency vocabulary [phi] names (xv6_trace_pure,
          # fs_boot_pure, snap_ok and its cone, the link-count definitions),
          # which live in files the general theorem reaches for other reasons.
          # Do not read containment off the file column.
          #
          # DO NOT EXPECT THE APPLICATION ROW TO BE THE BIGGEST just because it is
          # the application theorem: it has the most PROOF behind it and the
          # least STATEMENT in front of it.  What it says is a property of the
          # UART trace, so its base is the machine + device model, [ObsTrace]
          # and the union line model ([UnionDisc]/[PipesDisc]/[FileDisc] and
          # the program trees they read), with no file-system proof in it.
          #
          # WHAT TO WATCH IS THE LINE MODEL'S CONTRIBUTION.  For the other three
          # the statement vocabulary is FS consistency, which this tree defines
          # either way; here THE PREDICATE IS THE SPECIFICATION, so a
          # Print Assumptions of a theorem about the wrong [lm_disc]/[lm_good_out] is
          # worth nothing and this table is what rules that out.  The counts
          # are not quoted in this comment on purpose: they move with every
          # proof edit, and the tables below print the live ones.
          #
          # EACH RUN OVERWRITES tools/tcb/TcbSeed.v, so the loop is SERIAL --
          # these are a few seconds apiece and there is nothing to win by
          # racing them into one scratch file.
          rc=0
          for thm in RiscvAdequacy.riscv_power_adequacy \
                     SystemAdequacy.xv6_power_adequacy_xv6Σ \
                     SystemAdequacy.xv6_fs_adequacy_xv6Σ \
                     UInitUnion.union_adequacy_closed; do
            log="$RUNNER_TEMP/tcb-${thm##*.}.log"
            if ./tools/tcb/tcb-report.sh "xv6iris.$thm" > "$log" 2>&1; then
              python3 tools/tcb/tcb_report.py "$log" --md --target "$thm" \
                >> "$GITHUB_STEP_SUMMARY"
              # AND THE SAME TABLE TO STDOUT, in the plain (non-Markdown) form.
              # The step summary above is rendered on the run page but is served
              # by NO API -- not the jobs endpoint, not the Checks API, not as an
              # artifact -- so nothing outside a browser can read these numbers.
              # The run LOG is fetchable (`gh run view --log`), so printing here
              # is what lets the paper's tr/scripts/gen-tcb.py take the trusted
              # base off a green run instead of rebuilding the tree to re-derive
              # it.  The `=== TCB <thm> ===` line delimits the four tables in
              # the log.  Same invocation as the summary above, without --md.
              # Best-effort: a hiccup here must not turn an otherwise-green
              # build red.
              echo "=== TCB $thm ==="
              python3 tools/tcb/tcb_report.py "$log" --target "$thm" || true
            else
              rc=$?
              {
                echo "## Trusted base of \`${thm##*.}\` (\`iris/\`)"
                echo
                echo "> :x: \`tools/tcb/tcb-report.sh\` failed (exit $rc)."
                echo
                echo '```'
                tail -40 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -f tools/tcb/TcbSeed.v tools/tcb/TcbSeed.vo tools/tcb/TcbSeed.vos \
                tools/tcb/TcbSeed.vok
          exit $rc

      # ---- 3c. Build profile (iris/, informational) ----
      # Consumes the TIMED log + the .v.timing files + coqdep's .CoqMakefile.d +
      # the .vo mtimes to report the most expensive statements and files, the
      # longest require chain (the critical path — the build is critical-path
      # bound, so this is the real floor), and an inline parallelism-over-time
      # chart.  The whole report is written straight to the job's step summary
      # (GitHub sanitizes raw SVG/images out of the summary, so the chart is
      # drawn in Unicode); no artifact upload -- everything is on the run page.
      # Stdlib-only Python; `continue-on-error` so a profiler hiccup never fails
      # an otherwise-green build.  Runs only on a successful build (no `if:`),
      # so the timing data is complete.
      - name: Proof build profile (iris/, informational)
        continue-on-error: true
        run: |
          python3 tools/proof_profile.py \
            --build-log "$RUNNER_TEMP/iris-build.log" \
            --iris-dir iris --out-dir "$RUNNER_TEMP/profile" \
            --jobs "$(nproc)" --top 30
          cat "$RUNNER_TEMP/profile/report.md" >> "$GITHUB_STEP_SUMMARY"
          # Tidy the workspace so the .v.timing files don't linger for later
          # steps (checkout wipes them next run regardless, but be explicit).
          rm -f iris/*.v.timing

      # ---- 3d. Check out xv6-riscv for coverage attribution (best-effort) ----
      # tools/proof_coverage.py attributes each function to a source file via
      # `nm` on xv6-riscv/kernel/*.o, falling back to scanning the .c/.S
      # sources themselves; with no xv6-riscv/ tree at all (it's .gitignored
      # and CI never builds it, see the note atop this file) every function
      # comes back "could not attribute". A plain clone -- never built, never
      # even the target of `make kernel` -- fixes that without going near the
      # ELF or KernelInstrs.v/KernelSyms.v regen path (those only fire off of
      # $(KERNEL_ELF), which nothing here builds). Placed after the Iris build
      # so it can't perturb it, and made fully non-blocking (continue-on-error
      # *and* `|| true`, belt-and-suspenders) since it depends on this runner
      # having network egress to GitHub, which isn't guaranteed.
      - name: Check out xv6-riscv for coverage attribution (best-effort, non-blocking)
        continue-on-error: true
        run: |
          test -d xv6-riscv || timeout 60 git clone --depth 1 \
            https://github.com/mit-pdos/xv6-riscv xv6-riscv || true

      # ---- 3e. Proof coverage report (iris/) ----
      # "What of the kernel is proved?" — the per-function proven / assumed /
      # partial / none hierarchy, rendered into the step summary next to the
      # build profile.  Plain Python over the checked-in kernel-rocq/ dump and
      # the iris/ sources (no opam env, no ELF -- the step above best-effort
      # checks out xv6-riscv/ for source-file attribution, but the coverage
      # numbers themselves never depend on it).  Unlike the two informational
      # steps around it, this one CAN fail the build — but only on consistency
      # errors: a MANIFEST_PROVEN/MANIFEST_ASSUMED entry whose file or lemma no
      # longer exists, or _CoqProject drift (a .v in the tree that the project
      # file does not list, so the build never compiles it — or one it lists
      # that is gone).  Those all mean the coverage numbers are lying, and each
      # fix is a one-line edit.  A file that is out of the build ON PURPOSE is
      # not drift and does not fail here, but it has to say so: comment its row
      # out to a bare `# Foo.v` (see coqproject_files' docstring), which is what
      # distinguishes a deliberate omission -- a descoped tier, or a file some
      # other target builds, as step 3b builds SystemAssumptions.v and
      # UnionAssumptions.v --
      # from the forgotten row this check is here to catch.  Either way the
      # file is counted by nobody, so a file omitted this way must carry no
      # coverage claims.  A mere coverage change never fails CI.  Runs only on a
      # successful build, so the report describes a green tree.
      - name: Proof coverage report (iris/)
        run: |
          # The report is written (and lands in the summary) even when --check
          # fails — a failing run is exactly when you want to read it.
          rc=0
          python3 tools/proof_coverage.py --format md \
            --out "$RUNNER_TEMP/coverage.md" --check || rc=$?
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # ---- 4. Dead-code report (iris/) ----
      # Informational only: find_dead.py reads the .glob files the step above
      # just emitted and lists definitions/lemmas nothing references.  Its hits
      # are heuristic (hint-DB-only lemmas and not-yet-consumed top-level
      # theorems can appear), so the output is logged for a human to read and
      # the step never fails the build — which is what `continue-on-error`
      # below actually enforces; the comment alone used to claim it while a
      # find_dead.py hiccup would have failed an otherwise-green proof build.
      # Needs no opam env — it is plain Python over .glob/.v text.
      #
      # This runs only if the build succeeded (a step with no `if:` is skipped
      # once an earlier one fails), which is also what makes the report
      # meaningful at all: find_dead.py scans whatever .glob files it finds and
      # says nothing about the rest, so on an unbuilt tree it reports a
      # cheerful "0 unreferenced ... (of 0 globs scanned)".  Read the glob count
      # in the trailing == line before trusting a clean report.
      - name: Dead-code report (iris/, informational)
        continue-on-error: true
        working-directory: iris
        run: python3 find_dead.py --dir . --triage

      # ---- 5. Device conformance (vtest-rocq/): the model against QEMU ----
      # The differential device tests, run against the QEMU captures that are
      # CHECKED IN (`vtest-rocq/{QEMU,JH7110}/*Gen.v`) — no QEMU here, no toolchain,
      # nothing regenerated.  So this is not a hunt for new hardware behaviours
      # (that is `make vtest-gen`, run by hand); it is the regression test that
      # the executions already recorded from real hardware are still executions
      # our system model ADMITS.  A test passes by COMPILING: it is a
      # `vm_cast_no_check`d equation between the model's reached state and the
      # capture, so there is nothing to check after coqc.  See
      # tools/vtest/README.md and claude-notes/projects/device-conformance.md.
      #
      # EVERY run must pass, and every one is COMPILED before the verdict:
      # `make vtest-check-ci` builds the suite with `-k` so one red run does
      # not hide the rest, then `vtest.py table --check` prints THE RUN TABLE
      # — every case, the runs it produced on each platform, and whether that
      # run has a passing proof — and fails the step if anything listed in
      # `_CoqProject` has no `.vo`.
      #
      # THE TABLE IS THE ONLY REPORT, and the work is done once.  A run is
      # listed in `_CoqProject` exactly when its proof holds, so the green set
      # and the table's "pass" column are the same fact read from the same
      # `.vo`; there is no second reporter to drift from it.
      #
      # A RUN WITH NO PASSING PROOF IS A FINDING, NOT A BROKEN BUILD.  It is
      # absent from `_CoqProject`, so this step stays green while its row in
      # the table says `no proof` — which is the honest shape, since "the
      # model does not exhibit what the machine did" is exactly what a failing
      # run means.  What DOES fail the step is a listed proof that stopped
      # compiling, i.e. a regression in something that used to hold.
      #
      # The build needs iris/'s .vo (RiscvExec + DevModel + ColdBoot and their
      # cone) and kernel-rocq/'s, both already on disk from the steps above —
      # nothing extra is compiled outside vtest-rocq/.  Measured on the dev VM:
      # ~200 files, longest single file 33 s, so the wall-clock floor is one
      # file and the step is minutes at most.
      #
      # LAST ON PURPOSE.  A step with no `if:` is skipped once an earlier one
      # fails, so putting the conformance gate after the informational reports
      # means a red run still leaves the profile, coverage and dead-code
      # reports in the summary — and the failure that stops the run is the one
      # a reader wants at the bottom of it.
      - name: Device conformance tests (vtest-rocq/, checked-in captures)
        run: |
          rc=0
          make SWITCH="$GITHUB_WORKSPACE" vtest-check-ci \
            VTEST_LOG="$RUNNER_TEMP/vtest-check.log" || rc=$?
          # `|| rc=$?` and not a bare call: the table exits nonzero when a
          # listed proof did not compile, and this job's shell is
          # `bash -eo pipefail`, so an unguarded failure would end the step
          # before the summary below is written.  The table is regenerated
          # rather than captured from the make output, so that a failure in
          # the make line above still leaves a table in the summary saying
          # WHICH runs are red.
          python3 tools/vtest/vtest.py table --format md \
            >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::A device-conformance proof stopped compiling; see the step summary."
          fi
          exit $rc
