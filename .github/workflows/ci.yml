name: CI

# Builds the Sail-generated Rocq model (model-xv6iris/), the checked-in kernel
# dump (kernel-rocq/), the checked-in user-program dumps (user-rocq/), and the
# Iris proofs (iris/).
#
# It deliberately does NOT:
#   * build the xv6 kernel ELF (the `xv6-riscv/` tree is .gitignored / absent),
#   * regenerate kernel-rocq/KernelInstrs.v (or the sibling KernelData/KernelSyms),
#   * regenerate the Sail model .v files (needs the `sail` compiler).
# The .v files for all three are checked in; CI only (re)compiles them to .vo.
# After the build, it best-effort clones (but never builds) `xv6-riscv/` so the
# proof-coverage report can attribute functions to source files; see the note
# on that step below.

on:
  push:
    branches: [main]
  pull_request:

# A new push does NOT cancel the in-flight run: it finishes, and the new push
# waits as pending.  GitHub keeps at most one pending run per group, so a burst
# of pushes coalesces -- each new push supersedes the previously-pending one --
# and the latest commit is built as soon as the running build completes.  (With
# cancel-in-progress, a push faster than the build time would starve CI: every
# run cancelled before finishing, so nothing ever completes.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: coqdev

    # WITHOUT THIS, a `run:` step gets GitHub's *default* shell, `bash -e {0}` --
    # which does NOT set pipefail.  Every `make … | tee log` below would then
    # exit with tee's status, i.e. always 0, and a failed proof build would sail
    # through as green.  Naming `bash` explicitly selects
    # `bash --noprofile --norc -eo pipefail {0}` instead, so the left-hand side
    # of a pipe fails the step.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      # Creates a project-local opam switch in $GITHUB_WORKSPACE/_opam and loads
      # its environment, so plain `opam exec -- …` targets that switch.
      # (setup-ocaml's own cache only covers the bare compiler switch, since it
      # runs before the `opam install` below — hence the explicit cache step.)
      - name: Set up OCaml / opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-repositories: |
            coq-released: https://coq.inria.fr/opam/released
            default: https://opam.ocaml.org

      # Cache the whole built switch (Rocq + Iris + Sail support take many
      # minutes to compile).  Keyed on the OS, compiler, and the pinned package
      # list — editing .github/coq-deps.txt busts the cache; the restore-keys
      # let an older switch be reused and reconciled by `opam install` on a miss.
      #
      # The key is also scoped to runner.name: a project-local opam switch bakes
      # its absolute workspace path into the switch, so it is NOT relocatable.
      # Different runners have different workspace paths (e.g. hosted
      # /home/runner/work/... vs. self-hosted /home/ubuntu/actions-runner/_work/...),
      # so a switch cached on one runner is invalid on another — restoring it
      # clobbers setup-ocaml's fresh switch and yields "No switch is currently
      # set".  Scoping by runner.name keeps each runner's cache to itself.
      - name: Cache opam switch
        uses: actions/cache@v5
        with:
          path: _opam
          key: ${{ runner.os }}-${{ runner.name }}-opam-5.3-${{ hashFiles('.github/coq-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.name }}-opam-5.3-

      # Pinned to match the development switch (Rocq 9.0.1, Iris 4.4.0, Sail
      # support 0.20.1).  The leaf packages pull in coq-stdpp transitively, but
      # we pin them too for a reproducible solve.  No-op on a cache hit.
      - name: Install Rocq / Iris / Sail toolchain
        run: opam install -y $(cat .github/coq-deps.txt)

      # ---- 1 + 2. Sail model (model-xv6iris/) and kernel dump (kernel-rocq/) ----
      # These two trees don't depend on one another, so build them concurrently.
      #
      #   * `make model` only depends on the model's _CoqProject — no ELF, no Sail.
      #   * For kernel-rocq we generate the CoqMakefile from the checked-in
      #     _CoqProject and run it directly, skipping the top-level `kernel-rocq`
      #     target whose .v rules depend on the (absent) kernel ELF and would
      #     otherwise clone+build xv6 and regenerate KernelInstrs.v.
      #
      # The same reasoning covers user-rocq/ (the dumped USER program images,
      # e.g. _sync): its top-level `user-rocq` target likewise depends on the
      # absent user ELFs, so CI generates its CoqMakefile and compiles the
      # checked-in .v directly.  The iris build needs its .vo (iris/_CoqProject
      # maps `-R ../user-rocq User`; UCodeSync.v Requires User.SyncInstrs).
      #
      # The kernel-rocq / user-rocq CoqMakefiles are generated first (cheap);
      # the model's is produced by `make model` itself.  All three sub-builds
      # are then backgrounded and waited on; the step fails if any one fails.
      - name: Build Sail model + kernel/user dumps (in parallel, no ELF rebuild / no regen)
        run: |
          make SWITCH="$GITHUB_WORKSPACE" kernel-rocq/CoqMakefile
          make SWITCH="$GITHUB_WORKSPACE" user-rocq/CoqMakefile

          make SWITCH="$GITHUB_WORKSPACE" model &
          pid_model=$!
          opam exec -- make -C kernel-rocq -f CoqMakefile -j"$(nproc)" &
          pid_kernel=$!
          opam exec -- make -C user-rocq -f CoqMakefile -j"$(nproc)" &
          pid_user=$!

          rc=0
          wait $pid_model || rc=1
          wait $pid_kernel || rc=1
          wait $pid_user || rc=1
          exit $rc

      # ---- 3. Iris proofs (iris/) ----
      # Built directly (not via `make proofs`) for the same reason: `proofs`
      # depends on the `kernel-rocq` target which pulls in the kernel ELF.  The
      # model, kernel-rocq and user-rocq .vo from the previous steps are on
      # disk already.
      - name: Build Iris proofs (iris/)
        run: |
          make SWITCH="$GITHUB_WORKSPACE" iris/CoqMakefile
          # Profiled build: TIMED=1 prints a per-file `Foo.vo (real: T, ...)`
          # line; TIMING=1 writes a per-sentence `<file>.v.timing` next to each
          # .v.  Both add negligible overhead but let the next step report where
          # the wall-clock goes.  `tee` keeps the per-file log for the profiler;
          # the job sets `shell: bash` (-eo pipefail), so a make failure still
          # fails here rather than being masked by tee's exit status.
          #
          # `--output-sync=target` is what keeps that log PARSEABLE.  Each TIMED
          # record is written by its own `command time`, all to this one pipe, so
          # without it two records interleave mid-line under -j (seen in run
          # 30438637495: "SpecConsoleintr.vo (reaSlp:e cSysPipe.vo (real: ...,
          # sys: 4.040.55,,") and the profiler loses both.  -O makes make buffer
          # each target's output and emit it whole.  It changes nothing the
          # profiler measures: per-file wall comes from the record itself and the
          # parallelism chart from .vo mtimes, neither from log line order.
          opam exec -- make -C iris -f CoqMakefile -j"$(nproc)" \
            --output-sync=target TIMED=1 TIMING=1 \
            2>&1 | tee "$RUNNER_TEMP/iris-build.log"

          # Grep the log as well as trusting the exit status, per
          # claude-notes/durable-notes.md.  The exit status IS propagated here
          # (verified: `command time` forwards a nonzero child status, and
          # pipefail makes tee not mask it), so this is belt-and-braces against
          # a future edit reintroducing the masking that b906a5b fixed.
          # Bare "Error" (as in dead-imports.yml) catches BOTH Rocq's "Error:"
          # and make's "*** [CoqMakefile:801: Foo.vo] Error 1"; verified
          # false-positive-free against run 30438637495's green build output
          # (0 matches in 1927 lines, and no iris file has "Error" in its name).
          if grep -q "Error" "$RUNNER_TEMP/iris-build.log"; then
            echo "::error::Errors in the iris build log despite a zero exit status."
            grep -B5 "Error" "$RUNNER_TEMP/iris-build.log" | head -50
            exit 1
          fi

      # ---- 3b. Build profile (iris/, informational) ----
      # Consumes the TIMED log + the .v.timing files + coqdep's .CoqMakefile.d +
      # the .vo mtimes to report the most expensive statements and files, the
      # longest require chain (the critical path — the build is critical-path
      # bound, so this is the real floor), and an inline parallelism-over-time
      # chart.  The whole report is written straight to the job's step summary
      # (GitHub sanitizes raw SVG/images out of the summary, so the chart is
      # drawn in Unicode); no artifact upload -- everything is on the run page.
      # Stdlib-only Python; `continue-on-error` so a profiler hiccup never fails
      # an otherwise-green build.  Runs only on a successful build (no `if:`),
      # so the timing data is complete.
      - name: Proof build profile (iris/, informational)
        continue-on-error: true
        run: |
          python3 tools/proof_profile.py \
            --build-log "$RUNNER_TEMP/iris-build.log" \
            --iris-dir iris --out-dir "$RUNNER_TEMP/profile" \
            --jobs "$(nproc)" --top 30
          cat "$RUNNER_TEMP/profile/report.md" >> "$GITHUB_STEP_SUMMARY"
          # Tidy the workspace so the .v.timing files don't linger for later
          # steps (checkout wipes them next run regardless, but be explicit).
          rm -f iris/*.v.timing

      # ---- 3c. Check out xv6-riscv for coverage attribution (best-effort) ----
      # tools/proof_coverage.py attributes each function to a source file via
      # `nm` on xv6-riscv/kernel/*.o, falling back to scanning the .c/.S
      # sources themselves; with no xv6-riscv/ tree at all (it's .gitignored
      # and CI never builds it, see the note atop this file) every function
      # comes back "could not attribute". A plain clone -- never built, never
      # even the target of `make kernel` -- fixes that without going near the
      # ELF or KernelInstrs.v/KernelSyms.v regen path (those only fire off of
      # $(KERNEL_ELF), which nothing here builds). Placed after the Iris build
      # so it can't perturb it, and made fully non-blocking (continue-on-error
      # *and* `|| true`, belt-and-suspenders) since it depends on this runner
      # having network egress to GitHub, which isn't guaranteed.
      - name: Check out xv6-riscv for coverage attribution (best-effort, non-blocking)
        continue-on-error: true
        run: |
          test -d xv6-riscv || timeout 60 git clone --depth 1 \
            https://github.com/mit-pdos/xv6-riscv xv6-riscv || true

      # ---- 3d. Proof coverage report (iris/) ----
      # "What of the kernel is proved?" — the per-function proven / assumed /
      # partial / none hierarchy, rendered into the step summary next to the
      # build profile.  Plain Python over the checked-in kernel-rocq/ dump and
      # the iris/ sources (no opam env, no ELF -- the step above best-effort
      # checks out xv6-riscv/ for source-file attribution, but the coverage
      # numbers themselves never depend on it).  Unlike the two informational
      # steps around it, this one CAN fail the build — but only on consistency
      # errors: a MANIFEST_PROVEN/MANIFEST_ASSUMED entry whose file or lemma no
      # longer exists, or _CoqProject drift (a .v in the tree that the project
      # file does not list, so the build never compiles it — or one it lists
      # that is gone).  Those all mean the coverage numbers are lying, and each
      # fix is a one-line edit.  A file that is out of the build ON PURPOSE is
      # not drift and does not fail here, but it has to say so: comment its row
      # out to a bare `# Foo.v` (see coqproject_files' docstring), which is what
      # distinguishes a descope from the forgotten row this check is here to
      # catch.  A mere coverage change never fails CI.  Runs only on a
      # successful build, so the report describes a green tree.
      - name: Proof coverage report (iris/)
        run: |
          # The report is written (and lands in the summary) even when --check
          # fails — a failing run is exactly when you want to read it.
          rc=0
          python3 tools/proof_coverage.py --format md \
            --out "$RUNNER_TEMP/coverage.md" --check || rc=$?
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # ---- 4. Dead-code report (iris/) ----
      # Informational only: find_dead.py reads the .glob files the step above
      # just emitted and lists definitions/lemmas nothing references.  Its hits
      # are heuristic (hint-DB-only lemmas and not-yet-consumed top-level
      # theorems can appear), so the output is logged for a human to read and
      # the step never fails the build — which is what `continue-on-error`
      # below actually enforces; the comment alone used to claim it while a
      # find_dead.py hiccup would have failed an otherwise-green proof build.
      # Needs no opam env — it is plain Python over .glob/.v text.
      #
      # This runs only if the build succeeded (a step with no `if:` is skipped
      # once an earlier one fails), which is also what makes the report
      # meaningful at all: find_dead.py scans whatever .glob files it finds and
      # says nothing about the rest, so on an unbuilt tree it reports a
      # cheerful "0 unreferenced ... (of 0 globs scanned)".  Read the glob count
      # in the trailing == line before trusting a clean report.
      - name: Dead-code report (iris/, informational)
        continue-on-error: true
        working-directory: iris
        run: python3 find_dead.py --dir . --triage
