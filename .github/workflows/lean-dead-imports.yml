name: Dead imports (Lean)

# Nightly dead-import sweep for the Lean tree (Xv6/, MachCSL/): the
# counterpart of .github/workflows/dead-imports.yml on `main`.
#
# tools/ci/dead_imports.sh needs the tree BUILT: it runs a metaprogram
# (tools/ImportNeeds.lean, a port of `lake shake`'s needs computation) over
# the elaborated environment, so this job repeats ci.yml's build -- same
# steps, same caches -- and only then runs the sweep.  On an unbuilt tree
# there would be nothing to analyse.
#
# INFORMATIONAL, and that is the one difference from the Rocq workflow: this
# job REPORTS the dead imports in its summary and changes nothing; it does
# not commit or push, so it needs no write permission and no rebuild gate.
# Removing them is by hand, on the build machine:
#     tools/ci/dead_imports.sh --apply && lake build Xv6 MachCSL
# (the rebuild is the only gate on what lands: an import can be dead in its
# own file and still be what a downstream file gets a module through).  The
# job fails only if the build or the analysis itself could not run.
#
# !! WHERE THIS FILE MUST LIVE.  GitHub fires `schedule` (and offers
# `workflow_dispatch`) ONLY for workflow files on the repository's DEFAULT
# branch, which is `main`, the Rocq tree.  On the `lean` branch this file is
# the source of truth but is inert: to turn the sweep on, copy it to
# `.github/workflows/lean-dead-imports.yml` on `main`.  That is why it is not
# called dead-imports.yml (the name is taken there) and why the checkout
# below names `ref: lean` instead of taking the triggering commit -- on a
# schedule that commit is main's head.

on:
  schedule:
    # 06:00 UTC nightly (cron is always UTC): two hours before the Rocq
    # sweep, which holds the same runner for hours.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Never cancel a run in progress; a second run queues behind the first.
concurrency:
  group: lean-dead-imports
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: coqdev
    timeout-minutes: 180

    # See ci.yml: GitHub's default shell has no pipefail.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          ref: lean

      # ---- Toolchain and caches: identical to ci.yml, so they are shared. ----
      - name: Probe for the pinned Lean toolchain
        id: elan
        run: |
          tc=$(tr -d '[:space:]' < lean-toolchain)
          dir=$(printf '%s' "$tc" | sed -e 's|/|--|g' -e 's|:|---|g')
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ -x "$HOME/.elan/bin/elan" ] && [ -x "$HOME/.elan/toolchains/$dir/bin/lean" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache elan + the pinned toolchain (only when the runner lacks it)
        if: steps.elan.outputs.present != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan/bin
            ~/.elan/settings.toml
            ~/.elan/toolchains/${{ steps.elan.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.name }}-elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages + model build
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages
            model/Lean_RV64D/.lake
            vendor/lean-sail/.lake
          key: ${{ runner.os }}-${{ runner.name }}-lake-deps-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'model/**', 'vendor/lean-sail/**') }}

      - name: Install toolchain (elan, Lean per lean-toolchain) and fetch packages
        run: tools/ci/run_all.sh toolchain

      # ---- Build, so that the environment the sweep reads exists. ----
      - name: Build Sail model + lean-sail + iris-lean (no regen)
        run: tools/ci/run_all.sh build-deps

      - name: Build proofs (lake build Xv6 MachCSL)
        run: tools/ci/run_all.sh build

      # ---- The sweep ----
      # The count goes to the log, the classified list (redundant / high /
      # manual: see the header of tools/ci/dead_imports.sh) to the summary.
      - name: Dead imports (report only)
        run: tools/ci/run_all.sh dead-imports
