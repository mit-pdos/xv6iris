name: Dead imports

# Nightly dead-import sweep for iris/: find imports that are provably
# removable, delete them, and push the deletions to main.
#
# `iris/detect_unused_imports.py --verify` needs the tree BUILT: it reads each
# file's .glob to shortlist candidate imports, then build-confirms every
# candidate by deleting it and recompiling the file with coqc.  So this job
# repeats ci.yml's build (same steps, same cached opam switch) and only then
# runs the checker.  --apply then deletes the confirmed set.
#
# The build below is also what makes the checker's shortlist meaningful at all:
# a file with no/outdated .glob is reported UNANALYSED rather than having every
# one of its imports flagged, so an unbuilt tree here would silently sweep
# nothing.
#
# --apply also lands "de-dups": the same module required twice in one file, the
# earlier occurrence dropped.  That scan is textual (no .glob needed) and by
# default only fires when nothing but other `Require`s sits between the two, so
# the drop cannot change what the file sees -- and since the module stays
# required by the same file, it cannot reach a downstream one either.
#
# --apply-rewrites additionally lands "re-points": an import that contributes no
# name of its own and only forwards one via `Require Export` (e.g. the WpGpr*
# shims) is swapped for the module actually defining that name.  A re-point only
# fires when NOTHING defined in the imported file itself is used, and --verify
# compiles the swap before it lands -- so a shim that silently supplies a
# notation/instance/hint fails there and is kept.  Unlike a removal it is not
# dead code, so it is counted separately in the commit message.
#
# WHY THE FULL REBUILD BELOW IS NOT OPTIONAL: --verify only proves each file
# still compiles on its own.  `Require` is transitive for LOADING, so a
# downstream file may reference a module that this file's import was what
# pulled in -- a removal can compile fine here and break the tree there.  The
# rebuild is also the ONLY gate on what lands: a push made with GITHUB_TOKEN
# deliberately does not trigger other workflows, so ci.yml will NOT run on the
# commit this job creates.

on:
  schedule:
    # 08:00 UTC nightly.  Cron here is always UTC.
    - cron: "0 8 * * *"
  workflow_dispatch:

# Never cancel a run in progress: a --verify pass is hours long, and a
# cancelled one lands nothing.  A second run just queues behind the first.
concurrency:
  group: dead-imports
  cancel-in-progress: false

# For pushing the deletions back to main.
permissions:
  contents: write

jobs:
  sweep:
    runs-on: coqdev
    # ~700 build-confirm compiles worst case, on top of two full builds.
    timeout-minutes: 600

    # Required for the `… | tee` steps below to fail the job when their
    # left-hand side fails: GitHub's default shell is `bash -e {0}` (NO
    # pipefail), so a piped make would exit with tee's status.  Naming `bash`
    # selects `bash --noprofile --norc -eo pipefail {0}`.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the pre-push rebase onto main can work.
          fetch-depth: 0

      # ---- Toolchain: identical to ci.yml, so the switch cache is shared. ----
      # See ci.yml for why the cache key is scoped to runner.name (a
      # project-local opam switch is not relocatable across runners).
      - name: Set up OCaml / opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          opam-repositories: |
            coq-released: https://coq.inria.fr/opam/released
            default: https://opam.ocaml.org

      - name: Cache opam switch
        uses: actions/cache@v5
        with:
          path: _opam
          key: ${{ runner.os }}-${{ runner.name }}-opam-5.3-${{ hashFiles('.github/coq-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.name }}-opam-5.3-

      - name: Install Rocq / Iris / Sail toolchain
        run: opam install -y $(cat .github/coq-deps.txt)

      # ---- Build, so that .vo/.glob exist for every file. ----
      # Same ELF-free / regen-free path as ci.yml.
      - name: Build Sail model + kernel/user dumps
        run: |
          make SWITCH="$GITHUB_WORKSPACE" kernel-rocq/CoqMakefile
          make SWITCH="$GITHUB_WORKSPACE" user-rocq/CoqMakefile

          make SWITCH="$GITHUB_WORKSPACE" model &
          pid_model=$!
          opam exec -- make -C kernel-rocq -f CoqMakefile -j"$(nproc)" &
          pid_kernel=$!
          opam exec -- make -C user-rocq -f CoqMakefile -j"$(nproc)" &
          pid_user=$!

          rc=0
          wait $pid_model || rc=1
          wait $pid_kernel || rc=1
          wait $pid_user || rc=1
          exit $rc

      - name: Build Iris proofs (iris/)
        run: |
          make SWITCH="$GITHUB_WORKSPACE" iris/CoqMakefile
          opam exec -- make -C iris -f CoqMakefile -j"$(nproc)"

      # ---- Find and delete the dead imports ----
      # XV6_SWITCH overrides the checker's hard-coded dev switch
      # (/shared/xv6rocq) so its `opam exec --switch=... -- coqc` targets the
      # project-local switch built above.
      #
      # The build-confirm runs several files at a time (the checker's --jobs
      # defaults to min(8, nproc); raise it here if the runner has RAM to
      # spare).  Each test compiles a throwaway copy of the file rather than the
      # file itself, so concurrent jobs never read a .vo another job is
      # rewriting -- parallelism buys wall-clock only, and cannot change a
      # verdict.
      - name: Remove dead imports
        id: apply
        working-directory: iris
        env:
          XV6_SWITCH: ${{ github.workspace }}
        run: |
          python3 detect_unused_imports.py --dir . --verify --apply \
            --apply-rewrites --report "$RUNNER_TEMP/report.md" \
            2>&1 | tee "$RUNNER_TEMP/apply.log"

          # `|| true`: the job's shell is `bash -eo pipefail`, so a grep that
          # matches nothing would kill the step before the :- default is used.
          removed=$(grep -oE 'removed [0-9]+ import\(s\) across [0-9]+ file\(s\)' \
            "$RUNNER_TEMP/apply.log" | tail -1 || true)
          repointed=$(grep -oE 're-pointed [0-9]+ import\(s\) across [0-9]+ file\(s\)' \
            "$RUNNER_TEMP/apply.log" | tail -1 || true)
          deduped=$(grep -oE 'de-duplicated [0-9]+ import\(s\) across [0-9]+ file\(s\)' \
            "$RUNNER_TEMP/apply.log" | tail -1 || true)

          # Name every kind of change, and drop whichever found nothing rather
          # than claiming "removed 0".
          [ "${removed#removed 0 }" = "$removed" ] || removed=
          [ "${repointed#re-pointed 0 }" = "$repointed" ] || repointed=
          [ "${deduped#de-duplicated 0 }" = "$deduped" ] || deduped=
          summary=
          for part in "$removed" "$deduped" "$repointed"; do
            [ -n "$part" ] || continue
            summary="${summary:+$summary, }$part"
          done
          echo "summary=${summary:-swept dead imports}" >> "$GITHUB_OUTPUT"

          # The report is the only record of the findings this job does NOT
          # apply (re-points, and imports the shortlist flagged but the build
          # proved were needed); the log is discarded with the runner.
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Any deletions?
        id: changed
        run: |
          if [ -z "$(git status --porcelain -- '*.v')" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No dead imports found; nothing to do."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- '*.v'
          fi

      # Only .v files: the build drops .vo/.glob/CoqMakefile all over the tree
      # (gitignored, but be explicit rather than trusting that).
      - name: Commit the deletions
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.v'
          git commit -m "iris: ${{ steps.apply.outputs.summary }} (nightly dead-import sweep)" \
                     -m "A removed import was unused; a de-duplicated one was a second Require of a module the file requires anyway (the surviving occurrence is the later one, which is what fixes shadowing); a re-pointed one contributed no name of its own and only forwarded one via Require Export, so it now imports the module defining that name directly. Each edit was confirmed by recompiling its file with the edit applied; the whole tree was then rebuilt green. Generated by .github/workflows/dead-imports.yml."

      # Rebase BEFORE the build check, so what gets verified is exactly what
      # gets pushed -- main can easily move during a run this long.
      - name: Rebase onto current main
        if: steps.changed.outputs.any == 'true'
        run: git pull --rebase origin main

      # ---- The gate: the whole tree must build green, or nothing is pushed ----
      # Incremental: coqdep rebuilds every file affected by the deletions.
      # Grep for "Error" as well as trusting the exit status, per iris/CLAUDE.md.
      - name: End-to-end build check
        if: steps.changed.outputs.any == 'true'
        run: |
          make SWITCH="$GITHUB_WORKSPACE" model 2>&1 | tee "$RUNNER_TEMP/build.log"
          opam exec -- make -C kernel-rocq -f CoqMakefile -j"$(nproc)" 2>&1 \
            | tee -a "$RUNNER_TEMP/build.log"
          opam exec -- make -C user-rocq -f CoqMakefile -j"$(nproc)" 2>&1 \
            | tee -a "$RUNNER_TEMP/build.log"
          opam exec -- make -C iris -f CoqMakefile -j"$(nproc)" 2>&1 \
            | tee -a "$RUNNER_TEMP/build.log"

          if grep -q "Error" "$RUNNER_TEMP/build.log"; then
            echo "::error::Tree does not build after removing dead imports; not pushing."
            grep -B5 "Error" "$RUNNER_TEMP/build.log" | head -50
            exit 1
          fi

      - name: Push to main
        if: steps.changed.outputs.any == 'true'
        run: git push origin HEAD:main
